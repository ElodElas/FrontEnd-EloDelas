<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redefinir Senha | Elo d'Elas</title>

    <link rel="stylesheet" href="css/RedefinirSenha.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <main class="pag-redefinir">

        <div class="logo-completa">
            <img src="img/LogoLogin.png" alt="Logo Elo d'Elas">
        </div>

        <div class="dados-pagina">

            <div class="topo">
                <p class="frase-topo">
                    <span>•</span> Conecte-se
                    <span>•</span> Compartilhe
                    <span>•</span> Cresça
                </p>

                <h3>Definir nova Senha</h3>

                <p class="texto-topo">
                    Sua senha deve ser diferente das anteriores
                </p>

                <div class="icone-chave">
                    <i class="fa-solid fa-key"></i>
                </div>

            </div>

            <div class="formulario-senha">

                <div class="campo-senha">
                    <i class="fa-solid fa-lock"></i>

                    <input type="password" placeholder="Senha">

                    <i class="fa-regular fa-eye-slash"></i>
                </div>

                <div class="campo-senha">
                    <i class="fa-solid fa-lock"></i>

                    <input type="password" placeholder="Confirme sua senha">

                    <i class="fa-regular fa-eye-slash"></i>
                </div>

            </div>

            <div class="conta">
                <a href="PagLogin.html" class="botao-redefinir">
                    Redefinir senha
                </a>
            </div>

            <a href="PagLogin.html" class="voltar-login">

                <i class="fa-solid fa-arrow-left"></i>

                <span>Voltar ao Login</span>

            </a>

        </div>

    </main>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar Senha | Elo d'Elas</title>

    <link rel="stylesheet" href="css/PagRecuperarSenha.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <main class="pag-recuperar-senha">
        <div class="logo-completa">
            <img src="img/LogoLogin.png" alt="Logo Elo d'Elas">
        </div>
        <div class="dados-pagina">

            <div class="topo">
                <p class="frase-topo">
                    <span>•</span> Conecte-se
                    <span>•</span> Compartilhe
                    <span>•</span> Cresça
                </p>

                <h3>Esqueceu a senha?</h3>

                <p class="texto-topo">
                    Não se preocupe! Siga as instruções para recuperar sua senha.
                </p>
            </div>

            <div class="icone-destaque">
                <i class="fa-solid fa-key"></i>
            </div>

            <div class="formulario-recuperacao">

                <div class="campo-email">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" placeholder="E-mail">
                </div>

            </div>

            <div class="botao-recuperar">
                <a href="ConfirmarCodigo.html" class="botao-redefinir">
                    Redefinir Senha
                </a>
            </div>

            <div class="voltar-login">
                <a href="PagLogin.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Voltar ao Login</span>
                </a>

            </div>


        </div>

    </main>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Elo d'Elas</title>

    <link rel="stylesheet" href="css/PagLogin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <main class="pag-login">

        <div class="logo-completa">
            <img src="img/LogoLogin.png" alt="Logo Elo d'Elas">
        </div>

        <div class="dados-pagina">

            <div class="topo">
                <p class="frase-topo">
                    <span>•</span> Conecte-se
                    <span>•</span> Compartilhe
                    <span>•</span> Cresça
                </p>

                <h3>Bem-vinda!</h3>

                <p class="texto-topo">
                    Faça seu login para continuar nessa jornada
                </p>
            </div>

            <div class="formulario-login">

                <div class="campo-email">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" placeholder="E-mail">
                </div>

                <div class="campo-senha">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Senha">
                    <i class="fa-regular fa-eye-slash"></i>
                </div>

                <a href="PagRecuperarSenha.html" class="esqueceu-senha">
                    Esqueceu sua senha?
                </a>
            </div>

            <div class="conta">
                <button type="submit" class="botao-entrar">
                    Entrar
                </button>

                <p>
                    Ainda não tem uma conta?

                    <a href="PagCadastro.html">Cadastre-se </a>
                </p>

            </div>

        </div>

    </main>

</body>

</html>

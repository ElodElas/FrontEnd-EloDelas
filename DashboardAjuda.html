<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuda Rápida | Elo d'Elas</title>

    <link rel="stylesheet" href="css/DashboardAjuda.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <main class="dashboard-ajuda">
        <aside class="barra-lateral">
            <a class="marca" href="PagLogin.html" aria-label="Elo d'Elas - início">
                <img src="img/LogoNegativa.png" alt="Elo d'Elas">
            </a>

            <nav class="navegacao" aria-label="Navegação principal">
                <a href="#inicio" class="item-navegacao">
                    <i class="fa-solid fa-house" aria-hidden="true"></i><span>Início</span>
                </a>
                <a href="DashboardAjuda.html" class="item-navegacao ativo" aria-current="page">
                    <i class="fa-regular fa-clipboard" aria-hidden="true"></i><span>Ajuda Rápida</span>
                </a>
                <a href="#oportunidades" class="item-navegacao">
                    <i class="fa-solid fa-medal" aria-hidden="true"></i><span>Oportunidades de Crescimento</span>
                </a>
                <a href="#comunidade" class="item-navegacao">
                    <i class="fa-solid fa-people-group" aria-hidden="true"></i><span>Comunidade</span>
                </a>
                <a href="#protecao" class="item-navegacao">
                    <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span>Proteção</span>
                </a>
            </nav>

            <section class="recado" aria-label="Mensagem da comunidade">
                <h1>Juntas somos mais fortes.</h1>
                <p>A força feminina é mostrada com mulheres conectadas.</p>
            </section>

            <a href="#perfil" class="usuario">
                <span class="avatar" aria-hidden="true">C</span>
                <span class="dados-usuario"><strong>Ana Beatriz</strong><small>Psicóloga</small></span>
            </a>
        </aside>

        <section class="conteudo" aria-label="Ajuda rápida">
            <img class="ramo ramo-superior" src="img/Ramo%20Topo.png" alt="" aria-hidden="true">
            <img class="ramo ramo-inferior" src="img/Ramo%20baixo.png" alt="" aria-hidden="true">
        </section>
    </main>
</body>

</html>
